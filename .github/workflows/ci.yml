name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          pip install -r requirements-analysis.lock
      - name: Install Lean 4.19.0
        run: |
          curl -sSfL https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o lean.tar.zst
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check proofs
        run: |
          lean -o proof/ShapeCore.olean proof/ShapeCore.lean | tee lean.out
          ! grep -q sorryAx lean.out
          LEAN_PATH=proof lean -o proof/AdmissionDomain.olean proof/AdmissionDomain.lean | tee admission.out
          ! grep -q sorryAx admission.out
          LEAN_PATH=proof lean proof/StaticAdmissionChecks.lean
      - name: Admission-domain and source-policy counterexamples
        run: |
          LEAN=lean python experiments/admission_domain.py --output admission-domain.json
          LEAN=lean python experiments/source_binding_case.py --output source-binding-case.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Differential test (compiler, runtime and Lean validator)
        run: LEAN=lean python experiments/differential.py --programs 300 --runs 2 --output diff.json
      - name: Three-way operational correspondence
        run: LEAN=lean python experiments/correspondence.py --programs 40 --output correspondence
      - name: Retained disk scientific implementation and proofs
        working-directory: legacy/v1
        run: python scripts/offline_check.py --cxx g++ --lean lean --output /tmp/disk-check
